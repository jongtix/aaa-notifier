server:
  shutdown: graceful

spring:
  application:
    name: aaa-notifier
  threads:
    virtual:
      enabled: true
  jackson:
    time-zone: Asia/Seoul
    property-naming-strategy: SNAKE_CASE
  data:
    redis:
      # Redis 연결 — 스트림 소비(CONSUMER-001)와 readiness PING이 사용한다. 필터 상태 저장소(filter:* 키) 읽기/쓰기는 FILTER-001 소관이다.
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_APPUSER_USERNAME}
      password: ${REDIS_APPUSER_PASSWORD}
      # 명령 타임아웃 (SPEC-NOTIFIER-CONSUMER-001 REQ-014). 미지정 시 Lettuce 기본 60s라 연결 두절 중 소비 호출이
      # 재전송 대기에 묶여 오류 로그가 최대 60초 늦게 남는다. XREADGROUP 블로킹 대기(notifier.stream.block-timeout=2s)보다
      # 길어야 한다 — 짧으면(실측 1s) 정상 폴링이 매번 타임아웃된다. 5s = 블로킹 대기 + 여유(2.5배), 종료 예산(30s)보다 충분히 짧다.
      timeout: 5s
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    # notifier DB 접근 (SPEC-NOTIFIER-FILTER-001 §D) — 장전 cron의 참조 SELECT 3종 + notification_log DRYRUN INSERT만 수행한다.
    # DDL은 소유하지 않는다(ADR-016 — collector Flyway 소관). JPA·Flyway는 도입하지 않는다(plan.md §D.1).
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: notifier
    password: ${MYSQL_NOTIFIER_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 일 1회 배치 SELECT + 결정 빈도의 INSERT만 수행하므로 최소 풀로 충분하다(ADR-027 전 서비스 합산 < max_connections 151, plan.md §D.2).
      maximum-pool-size: 2
      minimum-idle: 1
      # DRYRUN INSERT는 틱 소비 스레드에서 동기 호출되고 최대 3회 시도한다(plan.md §C.3). 원래 1000ms로 짧게 두었으나
      # 프로덕션 컨테이너 자원 제한(0.5 CPU/400M) 하 JVM 콜드스타트(최대 46.79초)가 기동 직후 첫 DB 연결 시도와 경합해
      # CannotGetJdbcConnectionException을 유발했다(2026-09-30 정정, SPEC-NOTIFIER-FILTER-001 in-place amendment,
      # plan.md §C.3/§H R1 참조). 5000ms로 정정 — 커넥션 대기 상한이 늘어난 만큼 3회 모두 실패 시 최악 지연도
      # ≈ 3 × 5s(≤15s)로 재계산되나, sleep 없는 재시도 원칙(REQ-002 "틱 경로를 막지 않는다")은 그대로 유지된다.
      connection-timeout: 5000
      # 기동 시 DB 연결을 강제하지 않는다 — DB 장애가 기동 실패로 번지지 않게 하고(참조 적재는 WARN 폴백, plan.md §H R3),
      # 첫 연결 실패가 DataAccessException(CannotGetJdbcConnectionException)으로 변환되도록 한다.
      initialization-fail-timeout: -1

notifier:
  stream:
    # Redis Streams 소비 계층 (SPEC-NOTIFIER-CONSUMER-001 REQ-012 — 전부 외부화).
    # enabled=false면 그룹 생성도 소비 스레드 기동도 하지 않는다(기동 자체는 성공).
    enabled: ${NOTIFIER_STREAM_ENABLED:true}
    # XREADGROUP 블로킹 대기. 종료 신호에 대한 반응 지연의 상한이기도 하므로
    # spring.lifecycle.timeout-per-shutdown-phase(30s)보다 충분히 짧아야 한다.
    block-timeout: 2s
    read-batch-size: 10
    # 이 시간을 넘게 미확인인 메시지가 재소유 대상이다. 값 30s는 TECHSPEC §5.1(30초 이상 ACK 없는 메시지를 재할당)에서 온다.
    claim-idle-threshold: 30s
    # 재전달 횟수가 이 값을 "초과"하면 DLQ로 이관한다(3 → 4회째가 이관 대상).
    max-delivery-count: 3
    error-backoff: 5s
    # DLQ(stream:dlq:{stream명}) 길이 상한. TECHSPEC §5.1 — MAXLEN 500, 정확 트리밍(수동 확인 전 보존 대상이라 근사 트리밍을 쓰지 않는다).
    # 환경변수 NOTIFIER_STREAM_DLQ_MAX_LEN으로 재정의할 수 있다(다른 키와 동일하게 Spring relaxed binding).
    dlq-max-len: 500
  filter:
    # 필터/게이팅 파이프라인 (SPEC-NOTIFIER-FILTER-001). enabled=false면 파이프라인·장전 적재 빈을 올리지 않고 소비 계층의 무동작 핸들러가 남는다.
    enabled: ${NOTIFIER_FILTER_ENABLED:true}
    reference-load:
      # 장전 참조 데이터·밴드 적재 cron (REQ-001, ADR-008 cron 전용). 국내 = KST 개장 30분 전, 해외 = ET 개장 30분 전.
      domestic-cron: "0 30 8 * * MON-FRI"
      overseas-cron: "0 0 9 * * MON-FRI"
      # daily_ohlcv 조회 창(달력일). 20거래일 평균 거래량 + ATR(14) 입력 15거래일을 연휴 포함해도 확보하는 폭.
      lookback-days: 45
    band:
      # [1] δ — 밴드 이원 경계 마진(score 축). analyzer grade_boundaries.json grade_margin_delta.value와 수치가 같아야 한다(REQ-081).
      # notifier는 이미 δ가 반영된 PROMOTE/DEMOTE 밴드를 소비할 뿐 이 값으로 계산하지 않는다 — 배포 전 대조용 미러 값이다.
      delta: 0.010017154049042788
    # 이하 수치는 전부 plan.md §F 잠정값 — 과소 알림 방향(확증 많이·쿨다운 길게·임계 높게)으로 보수적이다. 드라이런 관측 후 보정한다.
    guard:
      # [2] 거래량 가드: 같은 시각까지의 20거래일 평균 누적 거래량 대비 이 비율 미만이면 전환 보류(REQ-021).
      volume-ratio: 0.30
      # [3] 시간대 가드: 개장 후 이 시간 이내 전환 억제(REQ-022).
      open-exclusion: 15m
      # [4] 시간대 가드: 마감 전 이 시간 이내 전환 억제(REQ-022).
      close-exclusion: 10m
      # [5] ATR 가드: 당일 누적 변동폭(고가-저가)이 ATR(14)의 이 배수를 넘으면 변동성 과열로 억제(REQ-022).
      atr-multiplier: 2.5
    # 등급 유지 확증 (SPEC-NOTIFIER-FILTER-002) — 전환 후보는 새 유효 등급이 전환 체결(같은 등급 연속 구간의 첫 체결) 시각부터
    # 아래 시간 이상 끊김 없이 유지돼야 확증을 통과한다. 체결 건수는 확증에 쓰지 않는다(거래량 가드가 얇은 거래를 막는다).
    # 체결 시각으로 재므로 체결이 없으면 다음 체결이 판정한다. 20칸 대응은 SPEC design.md §3.
    # 운영 튜닝 대상 — 드라이런 관측 후 보정한다.
    # 0 이하·누락은 기동 실패. 순서 세 쌍(direct ≤ hold-exit, weakening ≤ hold-entry, strength-up ≤ strong-entry)을
    # 어겨도 기동 실패하며, 위반한 쌍의 키와 값이 오류 로그에 남는다(같은 값은 허용).
    # 테스트는 체결 시각으로 시간을 제어하고 이 값을 줄이지 않는다.
    dwell:
      direct: 5m         # 매수계↔매도계 직접 전환(STRONG 도착 ※칸 포함)
      hold-exit: 7m      # 방향 → HOLD
      weakening: 7m      # STRONG → 같은 방향 비STRONG (Tier 3)
      hold-entry: 10m    # HOLD → BUY/SELL
      strength-up: 10m   # BUY → STRONG_BUY, SELL → STRONG_SELL (Tier 1)
      strong-entry: 15m  # HOLD → STRONG_BUY/STRONG_SELL (Tier 1※)
    cooldown:
      # 같은 종목·horizon·Tier 재전환 억제 시간 — 직접(없음) < HOLD 이탈 < HOLD 진입(REQ-032/034). 장 시작 시 초기화된다.
      direct: 0m      # [9] TECHSPEC §8.3 "긴급도 높음, 없음"
      hold-exit: 10m  # [10]
      hold-entry: 30m # [11]
      # Tier 1 순수 강도 강화(BUY→STRONG_BUY 등) 같은 방향 반복 억제(REQ-035).
      tier1-repeat: 20m
      # Tier 3 강도 완화(STRONG_BUY→BUY 등). plan.md §F 표에 없는 값 — design.md §4 M5 확인 사항에 따라 HOLD 이탈과 같은 '짧음' 등급으로 잠정.
      tier3-weakening: 10m
    confidence:
      # confidence 방향성 판정 임계(Δconfidence): 회전 윈도가 매 단계 하락하면서 처음-마지막 하락 폭이 이 값 이상이면 약화 추세 →
      # Tier 구분 없이 모든 전환 후보를 강등·억제한다(REQ-052, Tier 1 포함).
      weakening-delta: 0.05
      # 저확신 표시 임계: 이 값 미만 confidence는 결정에 표시 플래그만 싣는다 — 발송 차단 아님(REQ-053).
      low-threshold: 0.65
      # confidence 회전 윈도 길이(N거래일) — filter:confidence 리스트에 최근 N개만 보관, 만료 없음(REQ-051).
      window-size: 5
  telegram:
    # 매매봇 실발송 (SPEC-NOTIFIER-TELEGRAM-001). 기본값 false = 드라이런 관문([D-8]) — 꺼져 있으면 FILTER-001 DRYRUN 싱크가
    # 그대로 쓰이고 텔레그램·대기 큐·safe_mode·stream:alert 어디에도 손대지 않는다(REQ-001). 켜는 시점은 드라이런 검토 후 운영자가 정한다.
    enabled: ${NOTIFIER_TELEGRAM_ENABLED:false}
    # 매매봇 토큰·수신 chat_id — 비밀 값은 환경변수로만 주입한다(.env.notifier). 실발송 모드에서 비어 있으면 기동이 실패한다(REQ-003).
    bot-token: ${TELEGRAM_TRADE_BOT_TOKEN:}
    chat-id: ${TELEGRAM_TRADE_CHAT_ID:}
    base-url: https://api.telegram.org
    # 이하 수치는 plan.md §F 잠정값. 같은 chat_id 연속 요청 최소 간격 — 공식 FAQ 채팅당 1건/초(REQ-004).
    min-send-interval: 1s
    # 발송 1회 최악 13초(연결 3초 + 응답 10초).
    connect-timeout: 3s
    read-timeout: 10s
    # 디스패치 버퍼 상한 — 초과분은 즉시 대기 큐로 이관한다(plan.md §D.2).
    dispatch-buffer-capacity: 100
    # stream:alert 근사 MAXLEN (TECHSPEC §5.1).
    alert-stream-max-len: 500
    retry:
      # 5xx·타임아웃·입출력 오류 재시도 K(총 3회 시도), 백오프 1초 → 2초. 최악 누계 3×13초 + 3초 = 42초 < 60초 SLA.
      transient-retries: 2
      backoff-initial: 1s
      backoff-multiplier: 2
    rate-limit:
      # 429에 retry_after가 없을 때의 대기(research.md §3 미실측 폴백).
      default-wait: 5s
      # 알림 1건당 429 누적 대기 상한(이번 대기 포함) — 넘게 되면 기다리지 않고 대기 큐로 보낸다(REQ-022, D1).
      max-cumulative-wait: 30s
      # 알림 1건당 429 재발송 횟수 상한 — 4번째 재발송이 필요해지면 대기 큐로 보낸다.
      max-resends: 3
    safe-mode:
      # 연속 실패 N건에 safe_mode AUTO 자동 진입(REQ-031).
      failure-threshold: 3
      # safe_mode 프로브·대기 큐 요약 계기 — cron 전용(ADR-008), 1분 주기(REQ-032).
      probe-cron: "0 * * * * *"
    queue:
      # queue:telegram:pending 보존 기간·요약 목록 상한 (TECHSPEC §1.3).
      retention: 24h
      summary-list-limit: 10

logging:
  pattern:
    # 로컬 개발 전용. %m CRLF 방어 미적용 — 소비자가 개발자 본인이며 프로덕션은 ECS JSON 사용.
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%5p]){} %clr([%8.8X{trace_id}]){blue} %clr(${PID:-}){magenta} %clr(--- [%15.15t]){faint} %clr(%-40.40logger{39}){cyan}%clr(:%L){faint} %clr(:){faint} %m%n%wEx"
  file:
    name: ${LOG_PATH:/var/log/aaa-notifier}/aaa-notifier.log
  structured:
    format:
      # ECS JSON 구조화 로그 (파일 대상, KST — collector와 동일 패턴, ADR-011).
      # 파일 appender는 read_only 컨테이너에서 aaa-infra compose가 /var/log/aaa-notifier 쓰기 마운트를 제공한다.
      file: ecs
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_PATH:/var/log/aaa-notifier}/aaa-notifier.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 1GB
      max-history: 30
      total-size-cap: 50GB
  level:
    root: INFO
    org.springframework: WARN
    io.lettuce: WARN
    io.netty: WARN
    com.aaa.notifier: INFO

management:
  endpoints:
    web:
      exposure:
        # REQ-NOTIFIER-FOUNDATION-009/010 (B5): health + prometheus(VM 호환)만 내부 노출, 그 외 엔드포인트 미노출
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,redis
  health:
    db:
      # DB는 notifier에서 fail-open 경로다(참조 적재 실패 = 이전 캐시 유지, DRYRUN INSERT 실패 = WARN 폴백).
      # 기본 DataSourceHealthIndicator가 켜지면 DB 일시 장애가 /actuator/health DOWN → 컨테이너 unhealthy로 번지므로 끈다.
      enabled: false
    redis:
      # 기본 RedisHealthIndicator(INFO 명령) 비활성화 — 커스텀 RedisPingHealthIndicator(PING)로 대체 (ADR-015)
      enabled: false
