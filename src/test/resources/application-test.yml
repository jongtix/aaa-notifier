# test 프로파일 — 프로덕션 환경변수 자리를 테스트용 구체 값으로 오버라이드.
# 통합 테스트(@Tag("integration"))는 RedisAutoConfiguration이 활성이므로 host/port/자격증명 placeholder가
# 해소되어야 한다. host/port는 Testcontainers @ServiceConnection ConnectionDetails가 다시 덮어쓴다.
# redis:8-alpine은 인증이 없으므로 username/password는 빈 값으로 둔다.
spring:
  data:
    redis:
      host: localhost
      port: 6379
      username: ""
      password: ""

# management.endpoint.health.group.readiness는 redis 컨트리뷰터 존재를 전제한다(application.yml).
# smoke 프로파일(application-smoke.yml)은 RedisAutoConfiguration을 의도적으로 exclude하므로,
# 그 컨텍스트에서는 group membership 검증(기본 true)이 NoSuchHealthContributorException으로 실패한다.
# 프로덕션 검증(application.yml, 기본 true)은 그대로 두고 테스트 전용으로만 완화한다.
management:
  endpoint:
    health:
      validate-group-membership: false
