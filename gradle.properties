version=1.0.0

# netty-codec 강제 override: spring-boot-starter-data-redis -> lettuce-core -> netty-handler ->
# netty-codec 경로로 4.1.135.Final이 유입되며 CVE-2026-59901(HIGH)에 해당한다.
# Spring Boot 3.5는 2026-06-30 EOL이라 BOM 경유로는 수정 버전이 유입되지 않아 직접 override했다.
# 삭제 조건: Spring Boot 4.x 업그레이드로 BOM이 netty-codec >= 4.1.136.Final을 기본 유입하게 되면
# 이 override를 삭제할 것 (관련: aaa-infra#116).
netty.version=4.1.136.Final
